name: Build i915 SR-IOV driver for Unraid

on:
  workflow_dispatch:
    inputs:
      i915_ref:
        description: 'strongtz/i915-sriov-dkms tag to build (e.g. 2026.08.12.1), or "latest"'
        required: false
        default: 'latest'
        type: string
      kernel_release:
        description: 'Unraid kernel release to build for (e.g. 6.18.44-Unraid)'
        required: false
        default: '6.18.44-Unraid'
        type: string
      package_build:
        description: 'Package build number'
        required: false
        default: '1'
        type: string
  schedule:
    # Daily check for new strongtz releases (cloud build of the newest version)
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: i915-sriov-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      # GCC 15 matches the official Unraid kernel toolchain; the 6.18 kernel
      # requires -fmin-function-alignment (gcc >= 14).
      image: gcc:15.3.0
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git kmod \
            libelf-dev make tar xz-utils
          rm -rf /var/lib/apt/lists/*
          gcc --version | head -1
          nproc

      - name: Resolve i915 ref
        id: resolve
        shell: bash
        env:
          I915_REF_INPUT: ${{ inputs.i915_ref }}
        run: |
          set -euo pipefail
          ref="${I915_REF_INPUT:-latest}"
          if [ "$ref" = "latest" ]; then
            # fetch the newest strongtz release tag
            ref="$(curl -fsSL https://api.github.com/repos/strongtz/i915-sriov-dkms/releases/latest \
              | jq -r '.tag_name')"
          fi
          # strip a leading 'v' if present
          ref="${ref#v}"
          echo "i915_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Resolved strongtz ref: $ref"

      - name: Build i915 SR-IOV package
        shell: bash
        env:
          I915_SRIOV_REF: ${{ steps.resolve.outputs.i915_ref }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
          TARGET_KERNEL_VERSION: ${{ inputs.kernel_release }}
          PACKAGE_BUILD: ${{ inputs.package_build }}
        run: |
          set -euo pipefail
          # TARGET_KERNEL_VERSION is like 6.18.44-Unraid; strip the suffix for the tree dir
          export TARGET_KERNEL_VERSION="${KERNEL_RELEASE%-Unraid}"
          ./scripts/build-i915-sriov.sh

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          pkg="$(ls out/i915-sriov-*.txz | head -1)"
          pkg_base="$(basename "$pkg")"
          release_tag="${KERNEL_RELEASE}"
          # (re)create the release for this kernel so the plugin can find the
          # newest package; keep older assets by only adding what's missing
          gh release create "$release_tag" "$pkg" "$pkg.md5" \
            --repo "$GITHUB_REPOSITORY" \
            --title "i915 SR-IOV for ${KERNEL_RELEASE}" \
            --notes "Auto-built from strongtz/i915-sriov-dkms @ ${{ steps.resolve.outputs.i915_ref }}" \
            || gh release upload "$release_tag" "$pkg" "$pkg.md5" --repo "$GITHUB_REPOSITORY" --clobber
